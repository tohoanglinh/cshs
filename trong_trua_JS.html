<script>
  // ==== Biến toàn cục của module Trông trưa ====
  var ttDanhSachGV = [];      // [{hoTen, boPhan}] toàn bộ nhân sự (tra Bộ phận tự động)
  var ttDanhSachLop = [];     // Danh sách lớp
  var ttDanhSachNgayHienTai = []; // [{ngay, hoTen, boPhan, lop}] của KHOẢNG NGÀY đang xem/nhập
  var ttDanhSachNgayGoc = [];     // Bản gốc (đã tải/đã lưu) của khoảng đang xem, để so sánh phát hiện thay đổi chưa lưu
  var ttTuNgayDangXem = '';       // "yyyy-MM-dd" - đầu khoảng ngày đang thực sự hiển thị trên màn hình
  var ttDenNgayDangXem = '';      // "yyyy-MM-dd" - cuối khoảng ngày đang thực sự hiển thị trên màn hình
  var ttDanhSachThangHienTai = []; // [{ngay, ngayHienThi, danhSach}] các ngày có người của tháng đang chọn
  var ttThangTrangHienTai = 0;     // Trang hiện tại (0-based) khi hiển thị Danh sách trông trưa tháng theo trang
  var TT_SO_NGAY_MOI_TRANG = 5;    // Số ngày tối đa hiển thị mỗi trang (Danh sách trông trưa tháng)

  var ttSapXepCot = 'ngay';        // Cột đang sắp xếp của bảng khoảng ngày: 'ngay' | 'hoTen' | 'boPhan' | 'lop'
  var ttSapXepChieu = 1;           // 1 = tăng dần, -1 = giảm dần
  var ttTrangKhoangHienTai = 0;    // Trang hiện tại (0-based) của bảng danh sách khoảng ngày đang nhập
  var TT_SO_DONG_MOI_TRANG = 10;   // Số dòng tối đa hiển thị mỗi trang (bảng danh sách khoảng ngày)

  var ttNgayNghi = {};             // "yyyy-MM-dd" -> lý do nghỉ. Ngày nằm trong đây sẽ KHÔNG xếp trông trưa

  // 1. Hàm hỗ trợ định dạng ngày YYYY-MM-DD / YYYY-MM
  function ttFormatDate(date) {
    var d = new Date(date), month = '' + (d.getMonth() + 1), day = '' + d.getDate(), year = d.getFullYear();
    if (month.length < 2) month = '0' + month;
    if (day.length < 2) day = '0' + day;
    return [year, month, day].join('-');
  }
  function ttFormatThang(date) {
    var d = new Date(date), month = '' + (d.getMonth() + 1), year = d.getFullYear();
    if (month.length < 2) month = '0' + month;
    return year + '-' + month;
  }
  // "2026-08" -> "08/2026" (hiển thị)
  function formatThangHienThiTT(thangStr) {
    var p = (thangStr || '').split('-');
    if (p.length !== 2) return thangStr;
    return p[1] + '/' + p[0];
  }
  // "2026-08-28" -> "28/08/2026" (hiển thị)
  function formatNgayHienThiTT(ngayStr) {
    var p = (ngayStr || '').split('-');
    if (p.length !== 3) return ngayStr;
    return p[2] + '/' + p[1] + '/' + p[0];
  }

  // 1b. Hàm hỗ trợ xử lý Thứ trong tuần (dựng Date theo giờ địa phương để không lệch ngày)
  function ttParseNgay(ngayStr) {
    var p = (ngayStr || '').split('-');
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  }
  function ttLaCuoiTuan(ngayStr) {
    var thu = ttParseNgay(ngayStr).getDay(); // 0 = CN, 6 = T7
    return thu === 0 || thu === 6;
  }
  // Ngày nghỉ do người dùng khai báo (khác Thứ 7/CN) - không tổ chức trông trưa
  function ttLaNgayNghi(ngayStr) {
    return Object.prototype.hasOwnProperty.call(ttNgayNghi, ngayStr);
  }
  function ttEscHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  // Trả về mảng "yyyy-MM-dd" của TẤT CẢ các ngày từ tuNgay đến denNgay (bao gồm 2 đầu mút)
  function ttDanhSachNgayTrongKhoang(tuNgay, denNgay) {
    var ket = [];
    var d = ttParseNgay(tuNgay);
    var dCuoi = ttParseNgay(denNgay);
    var soNgayToiDa = 370; // giới hạn an toàn, tránh vòng lặp vô hạn nếu dữ liệu bất thường
    var dem = 0;
    while (d.getTime() <= dCuoi.getTime() && dem < soNgayToiDa) {
      ket.push(ttFormatDate(d));
      d.setDate(d.getDate() + 1);
      dem++;
    }
    return ket;
  }
  // Kiểm tra thứ tự hợp lệ của khoảng ngày
  function ttKiemTraThuTuKhoangNgay(tuNgay, denNgay) {
    if (!tuNgay || !denNgay) return { hopLe: false, loi: 'Vui lòng chọn đầy đủ "Từ ngày" và "Đến ngày"!' };
    if (denNgay < tuNgay) return { hopLe: false, loi: '"Đến ngày" phải sau hoặc bằng "Từ ngày"!' };
    return { hopLe: true };
  }

  // 2. Thiết lập mặc định: hôm nay & tháng hiện tại
  (function ttKhoiTaoMacDinh() {
    var today = new Date();
    var elTu = document.getElementById('ttTuNgay');
    var elDen = document.getElementById('ttDenNgay');
    var elThang = document.getElementById('ttThang');
    var elTkThang = document.getElementById('ttTkThang');
    if (elTkThang) elTkThang.value = ttFormatThang(today);
    if (elTu) elTu.value = ttFormatDate(today);
    if (elDen) elDen.value = ttFormatDate(today);
    if (elThang) elThang.value = ttFormatThang(today);
    var elNghiTu = document.getElementById('ttNghiTu');
    var elNghiDen = document.getElementById('ttNghiDen');
    if (elNghiTu) elNghiTu.value = ttFormatDate(today);
    if (elNghiDen) elNghiDen.value = ttFormatDate(today);
  })();

  // 3. Chuyển tab (Nhập / Tra cứu / Thống kê)
  function chuyenTabTrongTrua(tabName) {
    document.getElementById('tt-tab-nhap').classList.remove('active');
    document.getElementById('tt-tab-tracuu').classList.remove('active');
    document.getElementById('tt-tab-thongke').classList.remove('active');

    var navs = document.querySelectorAll('.tt-nav-item');
    navs.forEach(function(n) { n.classList.remove('active'); });

    if (tabName === 'nhap') {
      document.getElementById('tt-tab-nhap').classList.add('active');
      navs[0].classList.add('active');
    } else if (tabName === 'tracuu') {
      document.getElementById('tt-tab-tracuu').classList.add('active');
      navs[1].classList.add('active');
    } else if (tabName === 'thongke') {
      document.getElementById('tt-tab-thongke').classList.add('active');
      navs[2].classList.add('active');
      taiThongKeTT(); // luôn tải lại để thấy dữ liệu mới nhất sau khi lưu ở tab Nhập
    }
  }

  // 4. Tải danh sách nhân sự (Họ tên + Bộ phận) & danh sách lớp theo năm học đang chọn
  function taiDanhSachGVTrongTrua() {
    var maNamHoc = maNamHocHienTai();

    google.script.run
      .withSuccessHandler(function(res) {
        ttDanhSachGV = (res && res.dsgv) || [];
        ttDanhSachLop = (res && res.dsLop) || [];

        var dlHoTen = document.getElementById('dsHoTenTT');
        dlHoTen.innerHTML = ttDanhSachGV.map(function(gv) {
          return '<option value="' + gv.hoTen + '">';
        }).join('');

        var dlLop = document.getElementById('dsLopTT');
        dlLop.innerHTML = ttDanhSachLop.map(function(l) {
          return '<option value="' + l + '">';
        }).join('');
      })
      .withFailureHandler(function(err) {
        console.error('Lỗi tải danh sách nhân sự Trông trưa: ', err);
      })
      .layDSGVChoTrongTrua(maNamHoc);

    // Đồng thời tải luôn dữ liệu khoảng ngày đang chọn và tổng quan cả tháng
    doiKhoangNgayTrongTrua();
    taiDanhSachThangTT();
    taiNgayNghiTT();
  }

  // 5. Tự động điền Bộ phận khi gõ/chọn Họ và tên
  function tuDongDienBoPhan() {
    var ten = document.getElementById('ttHoTen').value.trim().toLowerCase();
    var elBoPhan = document.getElementById('ttBoPhan');
    if (!ten) { elBoPhan.value = ''; return; }

    var found = ttDanhSachGV.find(function(gv) {
      return (gv.hoTen || '').trim().toLowerCase() === ten;
    });
    elBoPhan.value = found ? (found.boPhan || '') : '';
  }

  // 6. Cập nhật nhãn "cho ngày .../cho khoảng từ ngày ... đến ngày ..." trong khung Thêm
  function ttCapNhatNhanKhoangNgay(tuNgay, denNgay) {
    var el = document.getElementById('ttKhoangNgayHienThi');
    if (!el) return;
    if (tuNgay === denNgay) {
      el.innerText = 'ngày ' + formatNgayHienThiTT(tuNgay);
    } else {
      el.innerText = 'từ ngày ' + formatNgayHienThiTT(tuNgay) + ' đến ngày ' + formatNgayHienThiTT(denNgay);
    }
  }

  // 6b. Cập nhật ô ghi chú cảnh báo (cuối tuần / ngày nghỉ / không hợp lệ) & khóa nút Thêm khi cần
  function ttCapNhatGhiChuKhoangNgay(tuNgay, denNgay) {
    var el = document.getElementById('ttGhiChuKhoangNgay');
    var btn = document.getElementById('ttBtnThem');
    if (!el) return;
    el.className = 'tt-range-note';
    el.innerText = '';

    var dsNgay = ttDanhSachNgayTrongKhoang(tuNgay, denNgay);
    var ngayCuoiTuan = dsNgay.filter(ttLaCuoiTuan);
    var ngayNghi = dsNgay.filter(function(n) { return !ttLaCuoiTuan(n) && ttLaNgayNghi(n); });
    var ngayLamViec = dsNgay.filter(function(n) { return !ttLaCuoiTuan(n) && !ttLaNgayNghi(n); });

    if (ngayLamViec.length === 0) {
      el.className = 'tt-range-note tt-note-error';
      el.innerText = '❌ Khoảng ngày đã chọn toàn bộ rơi vào Thứ 7/Chủ nhật hoặc ngày nghỉ — không tổ chức trông trưa nên không thể thêm dữ liệu.';
      if (btn) btn.disabled = true;
      return;
    }

    if (btn) btn.disabled = false;

    var ghiChu = [];
    if (ngayCuoiTuan.length > 0) {
      ghiChu.push('⚠️ ' + ngayCuoiTuan.length + ' ngày rơi vào Thứ 7/Chủ nhật (' +
        ngayCuoiTuan.map(formatNgayHienThiTT).join(', ') + ')');
    }
    if (ngayNghi.length > 0) {
      ghiChu.push('🏖️ ' + ngayNghi.length + ' ngày nghỉ (' +
        ngayNghi.map(formatNgayHienThiTT).join(', ') + ')');
    }
    if (ghiChu.length > 0) {
      el.className = 'tt-range-note tt-note-warning';
      el.innerText = ghiChu.join(' — ') + ' — sẽ KHÔNG thêm dữ liệu cho những ngày đó.';
    }
  }

  // 7. Khi đổi "Từ ngày"/"Đến ngày" -> tải lại danh sách đã lưu của cả khoảng, đồng bộ Tháng
  function doiKhoangNgayTrongTrua() {
    var tuNgay = document.getElementById('ttTuNgay').value;
    var denNgay = document.getElementById('ttDenNgay').value;

    var kt = ttKiemTraThuTuKhoangNgay(tuNgay, denNgay);
    if (!kt.hopLe) {
      var elNote = document.getElementById('ttGhiChuKhoangNgay');
      var btn = document.getElementById('ttBtnThem');
      elNote.className = 'tt-range-note tt-note-error';
      elNote.innerText = '❌ ' + kt.loi;
      if (btn) btn.disabled = true;
      document.getElementById('ttDanhSachNgay').innerHTML = '<div class="tt-empty">Vui lòng chọn khoảng ngày hợp lệ.</div>';
      return;
    }

    // Đồng bộ ô Tháng theo Từ ngày đang chọn
    var elThang = document.getElementById('ttThang');
    var thangCuaTuNgay = tuNgay.substring(0, 7);
    if (elThang && elThang.value !== thangCuaTuNgay) elThang.value = thangCuaTuNgay;

    ttCapNhatNhanKhoangNgay(tuNgay, denNgay);
    ttCapNhatGhiChuKhoangNgay(tuNgay, denNgay);

    var maNamHoc = maNamHocHienTai();
    document.getElementById('ttDanhSachNgay').innerHTML = '<div class="tt-empty">Đang tải dữ liệu...</div>';

    google.script.run
      .withSuccessHandler(function(res) {
        ttDanhSachNgayHienTai = res || [];
        ttDanhSachNgayGoc = JSON.parse(JSON.stringify(ttDanhSachNgayHienTai)); // lưu bản gốc để so sánh sau này
        ttTuNgayDangXem = tuNgay;
        ttDenNgayDangXem = denNgay;
        ttTrangKhoangHienTai = 0;
        ttXoaTrangBoLocKhoang();
        renderDanhSachKhoangTT();
        renderDanhSachThangTT(); // cập nhật lại highlight khoảng ngày đang chọn trong danh sách tháng
      })
      .withFailureHandler(function(err) {
        ttDanhSachNgayHienTai = [];
        ttDanhSachNgayGoc = [];
        ttTuNgayDangXem = tuNgay;
        ttDenNgayDangXem = denNgay;
        ttTrangKhoangHienTai = 0;
        ttXoaTrangBoLocKhoang();
        renderDanhSachKhoangTT();
        renderDanhSachThangTT();
      })
      .layTrongTruaTheoKhoangNgay(tuNgay, denNgay, maNamHoc);
  }

  // 7b. Kiểm tra xem danh sách đang nhập của khoảng ngày hiện tại có khác với bản gốc đã tải/lưu hay không
  function coThayDoiChuaLuuTT() {
    return JSON.stringify(ttDanhSachNgayHienTai) !== JSON.stringify(ttDanhSachNgayGoc);
  }

  // 7c. Đổi "Từ ngày"/"Đến ngày", có cảnh báo nếu khoảng ngày hiện tại còn dữ liệu
  //     vừa thêm mà CHƯA bấm Lưu (tránh mất dữ liệu do bấm nhầm/vô ý).
  //     onHuy: hàm gọi lại nếu người dùng chọn KHÔNG chuyển.
  function doiKhoangNgayTrongTruaCoXacNhan(onHuy) {
    var elTu = document.getElementById('ttTuNgay');
    var elDen = document.getElementById('ttDenNgay');

    if (!coThayDoiChuaLuuTT()) {
      doiKhoangNgayTrongTrua();
      taiDanhSachThangTT();
      return;
    }

    var moTaKhoangCu = ttTuNgayDangXem
      ? (ttTuNgayDangXem === ttDenNgayDangXem
          ? 'ngày ' + formatNgayHienThiTT(ttTuNgayDangXem)
          : 'từ ngày ' + formatNgayHienThiTT(ttTuNgayDangXem) + ' đến ngày ' + formatNgayHienThiTT(ttDenNgayDangXem))
      : 'khoảng ngày hiện tại';

    Swal.fire({
      title: 'Bạn chưa lưu dữ liệu!',
      text: 'Danh sách vừa thêm cho ' + moTaKhoangCu +
            ' sẽ bị mất nếu chuyển sang khoảng ngày khác mà chưa bấm Lưu. Cô có chắc muốn tiếp tục?',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      cancelButtonColor: '#3085d6',
      confirmButtonText: 'Bỏ qua & Chuyển ngày',
      cancelButtonText: 'Ở lại nhập tiếp'
    }).then(function(result) {
      if (result.isConfirmed) {
        doiKhoangNgayTrongTrua();
        taiDanhSachThangTT();
      } else {
        elTu.value = ttTuNgayDangXem; // khôi phục lại khoảng ngày cũ trên 2 ô input
        elDen.value = ttDenNgayDangXem;
        if (typeof onHuy === 'function') onHuy();
      }
    });
  }

  // 8. Khi đổi Tháng làm việc -> tải lại Danh sách trông trưa cả tháng (chỉ ngày có người).
  //    Nếu "Từ ngày"/"Đến ngày" đang chọn không thuộc tháng mới, đưa cả 2 về ngày 1 của
  //    tháng đó (có xác nhận nếu khoảng ngày cũ còn dữ liệu chưa lưu).
  function doiThangTrongTrua() {
    var thangVal = document.getElementById('ttThang').value;
    var elTu = document.getElementById('ttTuNgay');
    var elDen = document.getElementById('ttDenNgay');
    if (!thangVal) return;

    var tuThuocThangMoi = elTu.value && elTu.value.substring(0, 7) === thangVal;
    var denThuocThangMoi = elDen.value && elDen.value.substring(0, 7) === thangVal;

    if (!tuThuocThangMoi || !denThuocThangMoi) {
      var thangCu = ttTuNgayDangXem ? ttTuNgayDangXem.substring(0, 7) : thangVal;
      elTu.value = thangVal + '-01';
      elDen.value = thangVal + '-01';
      doiKhoangNgayTrongTruaCoXacNhan(function() {
        // Người dùng hủy chuyển ngày -> khôi phục lại Tháng làm việc về đúng tháng cũ
        document.getElementById('ttThang').value = thangCu;
        taiDanhSachThangTT();
      });
    } else {
      taiDanhSachThangTT();
    }
  }

  // 8b. Tải Danh sách trông trưa của cả THÁNG đang chọn (gom theo ngày, chỉ ngày có người)
  function taiDanhSachThangTT() {
    var thangVal = document.getElementById('ttThang').value;
    if (!thangVal) return;

    document.getElementById('ttThangHienThi').innerText = formatThangHienThiTT(thangVal);
    renderNgayNghiTT();

    var maNamHoc = maNamHocHienTai();
    document.getElementById('ttDanhSachThang').innerHTML = '<div class="tt-empty">Đang tải dữ liệu...</div>';

    google.script.run
      .withSuccessHandler(function(res) {
        ttDanhSachThangHienTai = res || [];
        ttThangTrangHienTai = 0;
        renderDanhSachThangTT();
      })
      .withFailureHandler(function(err) {
        ttDanhSachThangHienTai = [];
        ttThangTrangHienTai = 0;
        renderDanhSachThangTT();
      })
      .layTrongTruaTheoThang(thangVal, maNamHoc);
  }

  // 8c. Vẽ lại Danh sách trông trưa cả tháng - mỗi ngày là 1 thẻ, bấm vào để sửa/thêm ngày đó
  //     Chỉ hiển thị tối đa TT_SO_NGAY_MOI_TRANG ngày/trang, có nút chuyển trang (‹ Trước / Sau ›) nếu nhiều hơn.
  function renderDanhSachThangTT() {
    var box = document.getElementById('ttDanhSachThang');
    if (!box) return;

    if (!ttDanhSachThangHienTai || ttDanhSachThangHienTai.length === 0) {
      box.innerHTML = '<div class="tt-empty">Chưa có ai được xếp trông trưa trong tháng này.</div>';
      return;
    }

    var tongSoTrang = Math.ceil(ttDanhSachThangHienTai.length / TT_SO_NGAY_MOI_TRANG);
    if (ttThangTrangHienTai > tongSoTrang - 1) ttThangTrangHienTai = tongSoTrang - 1;
    if (ttThangTrangHienTai < 0) ttThangTrangHienTai = 0;

    var batDau = ttThangTrangHienTai * TT_SO_NGAY_MOI_TRANG;
    var dsTrangHienTai = ttDanhSachThangHienTai.slice(batDau, batDau + TT_SO_NGAY_MOI_TRANG);

    var html = '';
    dsTrangHienTai.forEach(function(ngayObj) {
      var dangChon = !!(ttTuNgayDangXem && ttDenNgayDangXem &&
        ngayObj.ngay >= ttTuNgayDangXem && ngayObj.ngay <= ttDenNgayDangXem);
      var tenNguoi = ngayObj.danhSach.map(function(p) {
        return p.hoTen + (p.lop ? ' (' + p.lop + ')' : '');
      }).join(', ');

      html += '<div class="tt-month-day-card' + (dangChon ? ' active' : '') + '" onclick="chonNgayTuThangTT(\'' + ngayObj.ngay + '\')">' +
        '<div class="tt-month-day-header"><span>📌 Ngày ' + ngayObj.ngayHienThi + '</span>' +
        '<span class="tt-month-day-count">' + ngayObj.danhSach.length + ' người</span></div>' +
        '<div class="tt-month-day-names">' + tenNguoi + '</div>' +
        '</div>';
    });

    if (tongSoTrang > 1) {
      html += '<div class="tt-month-pagination">' +
        '<button type="button" class="tt-page-btn"' + (ttThangTrangHienTai === 0 ? ' disabled' : '') +
          ' onclick="doiTrangThangTT(-1)">‹ Trước</button>' +
        '<span class="tt-page-info">Trang ' + (ttThangTrangHienTai + 1) + '/' + tongSoTrang + '</span>' +
        '<button type="button" class="tt-page-btn"' + (ttThangTrangHienTai === tongSoTrang - 1 ? ' disabled' : '') +
          ' onclick="doiTrangThangTT(1)">Sau ›</button>' +
        '</div>';
    }

    box.innerHTML = html;
  }

  // 8c-2. Chuyển trang (lùi/tiến) của Danh sách trông trưa tháng
  function doiTrangThangTT(delta) {
    ttThangTrangHienTai += delta;
    renderDanhSachThangTT();
  }

  // 8d. Bấm vào 1 ngày trong Danh sách tháng -> đưa ngày đó vào cả "Từ ngày" và "Đến ngày"
  //     để xem/sửa/thêm người ngay trong khung Thêm người trông trưa phía trên
  //     (có xác nhận nếu khoảng đang xem còn dữ liệu chưa lưu).
  function chonNgayTuThangTT(ngayStr) {
    document.getElementById('ttTuNgay').value = ngayStr;
    document.getElementById('ttDenNgay').value = ngayStr;
    doiKhoangNgayTrongTruaCoXacNhan();

    // Cuộn lên khung Thêm người để cô thấy ngay danh sách đang sửa
    var addCard = document.querySelector('.tt-add-card');
    if (addCard) addCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // 9. Thêm 1 người vào TẤT CẢ các ngày làm việc (Thứ 2 - Thứ 6) trong khoảng
  //    "Từ ngày" - "Đến ngày" đang chọn (chưa lưu server, chỉ ở giao diện).
  //    Ngày rơi vào Thứ 7/Chủ nhật sẽ tự động bị bỏ qua kèm cảnh báo.
  function themNguoiTrongTrua() {
    var hoTen = document.getElementById('ttHoTen').value.trim();
    var boPhan = document.getElementById('ttBoPhan').value.trim();
    var lop = document.getElementById('ttLop').value.trim();
    var tuNgay = document.getElementById('ttTuNgay').value;
    var denNgay = document.getElementById('ttDenNgay').value;

    if (!hoTen) {
      Swal.fire({ icon: 'warning', title: 'Nhắc nhở', text: 'Vui lòng nhập Họ và tên!', confirmButtonColor: '#f59e0b', confirmButtonText: 'Đã hiểu' });
      return;
    }
    if (!lop) {
      Swal.fire({ icon: 'warning', title: 'Nhắc nhở', text: 'Vui lòng nhập Lớp trông trưa!', confirmButtonColor: '#f59e0b', confirmButtonText: 'Đã hiểu' });
      return;
    }

    var kt = ttKiemTraThuTuKhoangNgay(tuNgay, denNgay);
    if (!kt.hopLe) {
      Swal.fire({ icon: 'warning', title: 'Nhắc nhở', text: kt.loi, confirmButtonColor: '#f59e0b', confirmButtonText: 'Đã hiểu' });
      return;
    }

    var dsNgay = ttDanhSachNgayTrongKhoang(tuNgay, denNgay);
    var ngayHopLe = dsNgay.filter(function(n) { return !ttLaCuoiTuan(n) && !ttLaNgayNghi(n); });
    var ngayCuoiTuanBiBoQua = dsNgay.filter(ttLaCuoiTuan);
    var ngayNghiBiBoQua = dsNgay.filter(function(n) { return !ttLaCuoiTuan(n) && ttLaNgayNghi(n); });

    // Đúng theo yêu cầu: nếu cả khoảng (kể cả trường hợp nhập 1 ngày, Từ ngày = Đến ngày)
    // đều rơi vào Thứ 7/Chủ nhật thì KHÔNG điền thông tin, chỉ đưa ra cảnh báo.
    if (ngayHopLe.length === 0) {
      Swal.fire({
        icon: 'warning',
        title: 'Không thể thêm!',
        text: (tuNgay === denNgay ? 'Ngày ' + formatNgayHienThiTT(tuNgay) : 'Khoảng ngày đã chọn') +
              ' rơi vào Thứ 7/Chủ nhật hoặc ngày nghỉ — không tổ chức trông trưa nên không thể thêm dữ liệu.',
        confirmButtonColor: '#f59e0b',
        confirmButtonText: 'Đã hiểu'
      });
      return;
    }

    // 1. KIỂM TRA TRÙNG LỚP cho từng ngày hợp lệ, ngày nào trùng thì bỏ qua ngày đó
    var ngayTrungLop = [];  // [{ngay, nguoiDangTrong}]
    var ngayDaThem = [];    // các ngày thực sự thêm/cập nhật thành công

    ngayHopLe.forEach(function(ngay) {
      var idxTrungLop = ttDanhSachNgayHienTai.findIndex(function(item) {
        return item.ngay === ngay && (item.lop || '').trim().toLowerCase() === lop.toLowerCase();
      });

      if (idxTrungLop !== -1) {
        var nguoiDangTrong = ttDanhSachNgayHienTai[idxTrungLop].hoTen;
        if ((nguoiDangTrong || '').trim().toLowerCase() !== hoTen.toLowerCase()) {
          ngayTrungLop.push({ ngay: ngay, nguoiDangTrong: nguoiDangTrong });
          return; // Bỏ qua ngày này, không thêm
        }
      }

      // 2. Nếu người này đã có trong danh sách của đúng ngày đó -> cập nhật lại Lớp/Bộ phận
      var idxTrung = ttDanhSachNgayHienTai.findIndex(function(item) {
        return item.ngay === ngay && (item.hoTen || '').trim().toLowerCase() === hoTen.toLowerCase();
      });

      if (idxTrung !== -1) {
        ttDanhSachNgayHienTai[idxTrung].boPhan = boPhan;
        ttDanhSachNgayHienTai[idxTrung].lop = lop;
      } else {
        ttDanhSachNgayHienTai.push({ ngay: ngay, hoTen: hoTen, boPhan: boPhan, lop: lop });
      }
      ngayDaThem.push(ngay);
    });

    // Gom các cảnh báo lại (nếu có) để hiển thị 1 lần, tránh làm phiền nhiều lần
    var canhBao = [];
    if (ngayCuoiTuanBiBoQua.length > 0) {
      canhBao.push('⚠️ ' + ngayCuoiTuanBiBoQua.length + ' ngày rơi vào Thứ 7/Chủ nhật (' +
        ngayCuoiTuanBiBoQua.map(formatNgayHienThiTT).join(', ') + ') đã được BỎ QUA vì trường không tổ chức trông trưa.');
    }
    if (ngayNghiBiBoQua.length > 0) {
      canhBao.push('🏖️ ' + ngayNghiBiBoQua.length + ' ngày nghỉ (' +
        ngayNghiBiBoQua.map(formatNgayHienThiTT).join(', ') + ') đã được BỎ QUA vì không tổ chức trông trưa.');
    }
    if (ngayTrungLop.length > 0) {
      var chiTiet = ngayTrungLop.map(function(x) {
        return formatNgayHienThiTT(x.ngay) + ' (đã có ' + x.nguoiDangTrong + ')';
      }).join('; ');
      canhBao.push('⚠️ Lớp ' + lop + ' đã có người trông vào: ' + chiTiet + ' — những ngày này đã được BỎ QUA.');
    }

    if (ngayDaThem.length === 0) {
      // Không thêm được ngày nào (toàn bộ bị trùng lớp) -> chỉ cảnh báo, giữ nguyên form để cô sửa
      Swal.fire({
        icon: 'warning',
        title: 'Không thêm được ngày nào!',
        html: canhBao.join('<br><br>') || 'Không có ngày hợp lệ để thêm.',
        confirmButtonColor: '#f59e0b',
        confirmButtonText: 'Đã hiểu'
      });
      return;
    }

    renderDanhSachKhoangTT();

    if (canhBao.length > 0) {
      Swal.fire({
        icon: 'info',
        title: 'Đã thêm, nhưng có lưu ý',
        html: 'Đã thêm <b>' + hoTen + '</b> vào <b>' + ngayDaThem.length + '</b> ngày.<br><br>' + canhBao.join('<br><br>'),
        confirmButtonColor: '#1b8754',
        confirmButtonText: 'Đã hiểu'
      });
    }

    // Xóa trắng ô nhập để nhập tiếp (giữ nguyên khoảng ngày để thêm người khác)
    document.getElementById('ttHoTen').value = '';
    document.getElementById('ttBoPhan').value = '';
    document.getElementById('ttLop').value = '';
    document.getElementById('ttHoTen').focus();
  }

  // 10. Vẽ lại bảng danh sách của khoảng ngày đang chọn (hiện thêm cột Ngày khi khoảng > 1 ngày)
  //     - Có thể lọc nhanh theo Họ và tên / Bộ phận / Lớp qua 3 ô lọc phía trên bảng.
  //     - Bấm vào tiêu đề cột (Ngày / Họ và tên / Bộ phận / Lớp) để sắp xếp tăng/giảm dần.
  //     - Chỉ hiển thị tối đa TT_SO_DONG_MOI_TRANG dòng/trang, có nút chuyển trang nếu nhiều hơn.
  //     resetTrang: truyền true khi gọi từ việc gõ ô lọc, để tự động về trang 1.
  function renderDanhSachKhoangTT(resetTrang) {
    var box = document.getElementById('ttDanhSachNgay');
    var filterRow = document.getElementById('ttFilterRow');

    if (!ttDanhSachNgayHienTai || ttDanhSachNgayHienTai.length === 0) {
      if (filterRow) filterRow.style.display = 'none';
      box.innerHTML = '<div class="tt-empty">Chưa có ai được xếp trông trưa trong khoảng ngày này.</div>';
      return;
    }
    if (filterRow) filterRow.style.display = 'flex';

    var coNhieuNgay = document.getElementById('ttTuNgay').value !== document.getElementById('ttDenNgay').value;

    // Nếu khoảng chỉ có 1 ngày mà đang lỡ chọn sắp xếp theo cột "Ngày" (cột không hiển thị) -> về lại "Họ và tên"
    if (!coNhieuNgay && ttSapXepCot === 'ngay') ttSapXepCot = 'hoTen';

    if (resetTrang) ttTrangKhoangHienTai = 0;

    // Đọc giá trị 3 ô lọc nhanh (không phân biệt hoa/thường)
    var elLocHoTen = document.getElementById('ttLocHoTen');
    var elLocBoPhan = document.getElementById('ttLocBoPhan');
    var elLocLop = document.getElementById('ttLocLop');
    var locHoTen = elLocHoTen ? elLocHoTen.value.trim().toLowerCase() : '';
    var locBoPhan = elLocBoPhan ? elLocBoPhan.value.trim().toLowerCase() : '';
    var locLop = elLocLop ? elLocLop.value.trim().toLowerCase() : '';

    // Gắn kèm chỉ số gốc (idxGoc) để nút "Xóa" luôn xóa đúng phần tử trong mảng gốc dù đã lọc/sắp xếp/phân trang
    var dsCoIdx = ttDanhSachNgayHienTai
      .map(function(item, idxGoc) { return { item: item, idxGoc: idxGoc }; })
      .filter(function(o) {
        if (locHoTen && (o.item.hoTen || '').toLowerCase().indexOf(locHoTen) === -1) return false;
        if (locBoPhan && (o.item.boPhan || '').toLowerCase().indexOf(locBoPhan) === -1) return false;
        if (locLop && (o.item.lop || '').toLowerCase().indexOf(locLop) === -1) return false;
        return true;
      });

    dsCoIdx.sort(function(a, b) {
      var col = ttSapXepCot;
      var va, vb;
      if (col === 'ngay') { va = a.item.ngay || ''; vb = b.item.ngay || ''; }
      else if (col === 'boPhan') { va = (a.item.boPhan || '').toLowerCase(); vb = (b.item.boPhan || '').toLowerCase(); }
      else if (col === 'lop') { va = (a.item.lop || '').toLowerCase(); vb = (b.item.lop || '').toLowerCase(); }
      else { va = (a.item.hoTen || '').toLowerCase(); vb = (b.item.hoTen || '').toLowerCase(); }

      var cmp = va < vb ? -1 : (va > vb ? 1 : 0);
      if (cmp === 0) {
        // Đồng hạng -> sắp xếp phụ theo Ngày rồi Họ và tên để thứ tự luôn ổn định
        if (a.item.ngay !== b.item.ngay) cmp = a.item.ngay < b.item.ngay ? -1 : 1;
        else cmp = (a.item.hoTen || '').localeCompare(b.item.hoTen || '');
      }
      return cmp * ttSapXepChieu;
    });

    if (dsCoIdx.length === 0) {
      box.innerHTML = '<div class="tt-empty">Không tìm thấy người phù hợp với bộ lọc đang chọn.</div>';
      return;
    }

    var tongSoTrang = Math.ceil(dsCoIdx.length / TT_SO_DONG_MOI_TRANG);
    if (ttTrangKhoangHienTai > tongSoTrang - 1) ttTrangKhoangHienTai = tongSoTrang - 1;
    if (ttTrangKhoangHienTai < 0) ttTrangKhoangHienTai = 0;

    var batDau = ttTrangKhoangHienTai * TT_SO_DONG_MOI_TRANG;
    var dsHienThi = dsCoIdx.slice(batDau, batDau + TT_SO_DONG_MOI_TRANG);

    function tieuDeCot(nhan, ten) {
      var mui = ttSapXepCot === ten ? (ttSapXepChieu === 1 ? ' ▲' : ' ▼') : '';
      return '<th class="tt-th-sortable" onclick="ttDoiSapXepKhoang(\'' + ten + '\')">' + nhan + mui + '</th>';
    }

    var html = '<div class="tt-table-wrap"><table class="tt-table"><thead><tr>' +
      (coNhieuNgay ? tieuDeCot('Ngày', 'ngay') : '') +
      tieuDeCot('Họ và tên', 'hoTen') + tieuDeCot('Bộ phận', 'boPhan') + tieuDeCot('Lớp', 'lop') + '<th></th>' +
      '</tr></thead><tbody>';

    dsHienThi.forEach(function(o) {
      var item = o.item;
      var weekend = ttLaCuoiTuan(item.ngay);
      html += '<tr' + (weekend ? ' class="tt-row-weekend"' : '') + '>' +
        (coNhieuNgay ? '<td class="tt-col-ngay">' + formatNgayHienThiTT(item.ngay) + '</td>' : '') +
        '<td>' + item.hoTen + '</td>' +
        '<td>' + (item.boPhan || '') + '</td>' +
        '<td class="tt-col-lop">' + (item.lop || '') + '</td>' +
        '<td><button type="button" class="tt-btn-remove" onclick="xoaDongTrongTrua(' + o.idxGoc + ')">Xóa</button></td>' +
        '</tr>';
    });

    html += '</tbody></table></div>';

    if (tongSoTrang > 1) {
      html += '<div class="tt-list-pagination">' +
        '<button type="button" class="tt-page-btn"' + (ttTrangKhoangHienTai === 0 ? ' disabled' : '') +
          ' onclick="doiTrangKhoangTT(-1)">‹ Trước</button>' +
        '<span class="tt-page-info">Trang ' + (ttTrangKhoangHienTai + 1) + '/' + tongSoTrang + ' (' + dsCoIdx.length + ' dòng)</span>' +
        '<button type="button" class="tt-page-btn"' + (ttTrangKhoangHienTai === tongSoTrang - 1 ? ' disabled' : '') +
          ' onclick="doiTrangKhoangTT(1)">Sau ›</button>' +
        '</div>';
    }

    box.innerHTML = html;
  }

  // 10b. Bấm vào tiêu đề cột -> đổi cột sắp xếp (hoặc đảo chiều nếu bấm lại đúng cột đang sắp xếp)
  function ttDoiSapXepKhoang(cot) {
    if (ttSapXepCot === cot) {
      ttSapXepChieu = -ttSapXepChieu;
    } else {
      ttSapXepCot = cot;
      ttSapXepChieu = 1;
    }
    ttTrangKhoangHienTai = 0; // về trang đầu mỗi khi đổi cách sắp xếp
    renderDanhSachKhoangTT();
  }

  // 10c. Chuyển trang (lùi/tiến) của bảng danh sách khoảng ngày đang nhập
  function doiTrangKhoangTT(delta) {
    ttTrangKhoangHienTai += delta;
    renderDanhSachKhoangTT();
  }

  // 10d. Xóa trắng 3 ô lọc nhanh (gọi khi đổi khoảng ngày, tránh nhầm lẫn bộ lọc cũ với ngày mới)
  function ttXoaTrangBoLocKhoang() {
    var elLocHoTen = document.getElementById('ttLocHoTen');
    var elLocBoPhan = document.getElementById('ttLocBoPhan');
    var elLocLop = document.getElementById('ttLocLop');
    if (elLocHoTen) elLocHoTen.value = '';
    if (elLocBoPhan) elLocBoPhan.value = '';
    if (elLocLop) elLocLop.value = '';
  }

  // 11. Xóa 1 dòng khỏi danh sách của khoảng ngày (chỉ trên giao diện, cần bấm Lưu để áp dụng)
  function xoaDongTrongTrua(idx) {
    var item = ttDanhSachNgayHienTai[idx];
    if (!item) return;

    var tenHienThi = item.hoTen;
    var lopHienThi = item.lop ? ' lớp ' + item.lop : '';
    var ngayHienThi = formatNgayHienThiTT(item.ngay);

    Swal.fire({
      title: 'Xóa người trông trưa?',
      text: 'Cô có chắc muốn xóa ' + tenHienThi + ' khỏi danh sách trông trưa' + lopHienThi + ' vào ngày ' + ngayHienThi + ' không?',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      cancelButtonColor: '#3085d6',
      confirmButtonText: 'Xóa',
      cancelButtonText: 'Không'
    }).then(function(result) {
      if (result.isConfirmed) {
        ttDanhSachNgayHienTai.splice(idx, 1);
        renderDanhSachKhoangTT();
      }
    });
  }

  // 12. Lưu toàn bộ danh sách của khoảng ngày đang chọn lên Sheet (ghi đè đúng khoảng đó)
  function luuTrongTrua() {
    var tuNgay = ttTuNgayDangXem || document.getElementById('ttTuNgay').value;
    var denNgay = ttDenNgayDangXem || document.getElementById('ttDenNgay').value;
    if (!tuNgay || !denNgay) {
      Swal.fire({ icon: 'warning', title: 'Nhắc nhở', text: 'Vui lòng chọn khoảng ngày trước khi lưu!', confirmButtonColor: '#f59e0b', confirmButtonText: 'Đã hiểu' });
      return;
    }

    var btn = document.getElementById('ttBtnLuu');
    btn.disabled = true;
    btn.innerText = 'Đang lưu...';

    var maNamHoc = maNamHocHienTai();

    google.script.run
      .withSuccessHandler(function(msg) {
        btn.disabled = false;
        btn.innerText = '💾 Lưu';
        ttDanhSachNgayGoc = JSON.parse(JSON.stringify(ttDanhSachNgayHienTai)); // đánh dấu đã lưu, không còn thay đổi chưa lưu
        taiDanhSachThangTT(); // cập nhật lại Danh sách trông trưa cả tháng sau khi lưu
        Swal.fire({
          icon: 'success', title: 'Thành công!', text: msg || 'Đã lưu danh sách trông trưa!',
          confirmButtonColor: '#1b8754', confirmButtonText: 'Đồng ý'
        });
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerText = '💾 Lưu';
        Swal.fire({ icon: 'error', title: 'Lỗi khi lưu!', text: err, confirmButtonColor: '#d33' });
      })
      .luuTrongTruaTheoKhoangNgay(tuNgay, denNgay, maNamHoc, ttDanhSachNgayHienTai);
  }

  // 13. Xuất Excel bảng chấm công trông trưa cho cả THÁNG đang chọn
  function xuatExcelTrongTrua() {
    var thangVal = document.getElementById('ttThang').value; // yyyy-MM
    if (!thangVal) {
      Swal.fire({ icon: 'warning', title: 'Nhắc nhở', text: 'Vui lòng chọn Tháng làm việc trước khi xuất Excel!', confirmButtonColor: '#f59e0b', confirmButtonText: 'Đã hiểu' });
      return;
    }

    var maNamHoc = maNamHocHienTai();

    var newTab = window.open('about:blank', '_blank');
    if (newTab) {
      newTab.document.write(
        '<!DOCTYPE html><html><head><title>Đang tải bảng chấm công...</title><meta charset="utf-8">' +
        '<style>' +
        '  body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f6f9; }' +
        '  .card { background: #fff; padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 420px; }' +
        '  .spinner { border: 4px solid #ffe0b2; border-top: 4px solid #e65100; border-radius: 50%; width: 45px; height: 45px; animation: spin 0.9s linear infinite; margin: 0 auto 18px auto; }' +
        '  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }' +
        '  h3 { color: #e65100; margin: 0 0 10px 0; font-size: 20px; }' +
        '  p { color: #6c757d; font-size: 14px; margin: 0; line-height: 1.5; }' +
        '  .btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #e65100; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 14px; }' +
        '</style></head><body>' +
        '  <div class="card">' +
        '    <div class="spinner" id="iconSpinner"></div>' +
        '    <h3 id="txtTitle">⏳ Đang tạo bảng chấm công</h3>' +
        '    <p id="txtDesc">Dữ liệu đang được tổng hợp theo tháng. Cô vui lòng đợi giây lát...</p>' +
        '    <div id="btnContainer"></div>' +
        '  </div>' +
        '</body></html>'
      );
    }

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          if (newTab) {
            newTab.document.getElementById('iconSpinner').style.display = 'none';
            newTab.document.getElementById('txtTitle').innerText = "✅ Tải file thành công!";
            newTab.document.getElementById('txtDesc').innerHTML = "File <b>" + res.fileName + "</b> đang tự động tải xuống thư mục Downloads.";
            newTab.document.getElementById('btnContainer').innerHTML =
              '<a href="' + res.downloadUrl + '" class="btn">Click vào đây nếu file chưa tải về</a>';
            newTab.location.href = res.downloadUrl;
          }

          setTimeout(function() {
            google.script.run.xoaSheetTam(res.tempSheetName, res.maNamHoc);
          }, 12000);
        } else {
          if (newTab) newTab.close();
          Swal.fire({ icon: 'error', title: 'Thất bại', text: 'Không thể tạo dữ liệu xuất file.', confirmButtonColor: '#d33' });
        }
      })
      .withFailureHandler(function(err) {
        if (newTab) newTab.close();
        Swal.fire({ icon: 'error', title: 'Lỗi hệ thống!', text: err, confirmButtonColor: '#d33' });
      })
      .xuatFileTrongTruaChuan(thangVal, maNamHoc);
  }

  // ==================== NGÀY NGHỈ (không xếp trông trưa) ====================

  // Chọn "Nghỉ từ ngày" -> tự đồng bộ "Đến ngày" nếu đang trống hoặc nhỏ hơn
  function ttNghiDongBoDen() {
    var tu = document.getElementById('ttNghiTu').value;
    var elDen = document.getElementById('ttNghiDen');
    if (tu && (!elDen.value || elDen.value < tu)) elDen.value = tu;
  }

  // Áp dụng danh sách ngày nghỉ mới từ server: cập nhật map, vẽ lại danh sách, cập nhật ghi chú khoảng ngày
  function ttApDungDsNgayNghi(ds) {
    ttNgayNghi = {};
    (ds || []).forEach(function(o) { if (o && o.ngay) ttNgayNghi[o.ngay] = o.lyDo || ''; });
    renderNgayNghiTT();

    var tu = document.getElementById('ttTuNgay').value;
    var den = document.getElementById('ttDenNgay').value;
    if (ttKiemTraThuTuKhoangNgay(tu, den).hopLe) ttCapNhatGhiChuKhoangNgay(tu, den);
  }

  // Tải toàn bộ ngày nghỉ của năm học đang chọn
  function taiNgayNghiTT() {
    google.script.run
      .withSuccessHandler(function(res) { ttApDungDsNgayNghi(res); })
      .withFailureHandler(function(err) { console.error('Lỗi tải ngày nghỉ Trông trưa: ', err); })
      .layNgayNghiTrongTrua(maNamHocHienTai());
  }

  // Vẽ danh sách ngày nghỉ của THÁNG đang chọn
  function renderNgayNghiTT() {
    var box = document.getElementById('ttDanhSachNghi');
    if (!box) return;
    var thangVal = document.getElementById('ttThang').value;

    var elThang = document.getElementById('ttNghiThangHienThi');
    if (elThang) elThang.innerText = formatThangHienThiTT(thangVal);

    var dsThang = Object.keys(ttNgayNghi).filter(function(n) {
      return thangVal && n.substring(0, 7) === thangVal;
    }).sort();

    var elSo = document.getElementById('ttNghiSoNgay');
    if (elSo) elSo.innerText = dsThang.length;

    if (dsThang.length === 0) {
      box.innerHTML = '<div class="tt-empty">Tháng này chưa có ngày nghỉ nào.</div>';
      return;
    }

    var tenThu = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
    box.innerHTML = dsThang.map(function(n) {
      var thu = tenThu[ttParseNgay(n).getDay()];
      var lyDo = ttNgayNghi[n];
      return '<div class="tt-holiday-item">' +
        '<span class="tt-holiday-date">' + thu + ', ' + formatNgayHienThiTT(n) + '</span>' +
        '<span class="tt-holiday-reason">' + (lyDo ? ttEscHtml(lyDo) : '') + '</span>' +
        '<button type="button" class="tt-btn-remove" onclick="xoaNgayNghiTT(\'' + n + '\')">Xóa</button>' +
        '</div>';
    }).join('');
  }

  // Thêm ngày nghỉ (1 ngày hoặc 1 khoảng). Thứ 7/CN và ngày đã nghỉ sẽ tự bỏ qua.
  // Lưu NGAY lên Sheet (không cần bấm nút Lưu), đồng thời xóa người đã xếp trông trưa vào các ngày đó.
  function themNgayNghiTT() {
    var tu = document.getElementById('ttNghiTu').value;
    var den = document.getElementById('ttNghiDen').value;
    var lyDo = document.getElementById('ttNghiLyDo').value.trim();

    var kt = ttKiemTraThuTuKhoangNgay(tu, den);
    if (!kt.hopLe) {
      Swal.fire({ icon: 'warning', title: 'Nhắc nhở', text: kt.loi, confirmButtonColor: '#f59e0b', confirmButtonText: 'Đã hiểu' });
      return;
    }

    var ngayMoi = ttDanhSachNgayTrongKhoang(tu, den).filter(function(n) {
      return !ttLaCuoiTuan(n) && !ttLaNgayNghi(n);
    });
    if (ngayMoi.length === 0) {
      Swal.fire({ icon: 'info', title: 'Không có ngày nào để thêm', text: 'Các ngày đã chọn là Thứ 7/Chủ nhật hoặc đã được đặt là ngày nghỉ rồi.', confirmButtonColor: '#1a73e8', confirmButtonText: 'Đã hiểu' });
      return;
    }

    var moTa = ngayMoi.length <= 6
      ? ngayMoi.map(formatNgayHienThiTT).join(', ')
      : formatNgayHienThiTT(ngayMoi[0]) + ' … ' + formatNgayHienThiTT(ngayMoi[ngayMoi.length - 1]);

    Swal.fire({
      title: 'Đặt ngày nghỉ?',
      html: 'Sẽ đặt <b>' + ngayMoi.length + '</b> ngày nghỉ: ' + moTa + '.<br><br>' +
            'Nếu các ngày này đã có người xếp trông trưa thì dữ liệu đó sẽ bị <b>xóa</b>.',
      icon: 'question',
      showCancelButton: true,
      confirmButtonColor: '#1a73e8',
      cancelButtonColor: '#999',
      confirmButtonText: 'Đặt ngày nghỉ',
      cancelButtonText: 'Hủy'
    }).then(function(result) {
      if (!result.isConfirmed) return;

      var btn = document.getElementById('ttBtnThemNghi');
      btn.disabled = true;
      btn.innerText = 'Đang lưu...';

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btn.innerText = '➕ Thêm ngày nghỉ';
          if (!res || !res.success) {
            Swal.fire({ icon: 'error', title: 'Lỗi!', text: (res && res.message) || 'Không lưu được ngày nghỉ.', confirmButtonColor: '#d33' });
            return;
          }
          ttApDungDsNgayNghi(res.dsNgayNghi);

          // Bỏ các dòng đang hiển thị (chưa lưu hoặc đã lưu) thuộc ngày vừa đặt nghỉ
          var boNgayNghi = function(it) { return !ttLaNgayNghi(it.ngay); };
          ttDanhSachNgayHienTai = ttDanhSachNgayHienTai.filter(boNgayNghi);
          ttDanhSachNgayGoc = ttDanhSachNgayGoc.filter(boNgayNghi);
          renderDanhSachKhoangTT();
          taiDanhSachThangTT();

          document.getElementById('ttNghiLyDo').value = '';
          Swal.fire({
            icon: 'success', title: 'Đã đặt ngày nghỉ',
            text: res.message || 'Đã lưu ngày nghỉ.',
            confirmButtonColor: '#1a73e8', confirmButtonText: 'Đồng ý'
          });
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerText = '➕ Thêm ngày nghỉ';
          Swal.fire({ icon: 'error', title: 'Lỗi!', text: err && err.message ? err.message : String(err), confirmButtonColor: '#d33' });
        })
        .themNgayNghiTrongTrua(tu, den, lyDo, maNamHocHienTai());
    });
  }

  // Xóa 1 ngày nghỉ (ngày đó lại được phép xếp trông trưa bình thường)
  function xoaNgayNghiTT(ngay) {
    Swal.fire({
      title: 'Bỏ ngày nghỉ?',
      text: 'Ngày ' + formatNgayHienThiTT(ngay) + ' sẽ không còn là ngày nghỉ và có thể xếp trông trưa trở lại.',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      cancelButtonColor: '#3085d6',
      confirmButtonText: 'Bỏ ngày nghỉ',
      cancelButtonText: 'Không'
    }).then(function(result) {
      if (!result.isConfirmed) return;
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res || !res.success) {
            Swal.fire({ icon: 'error', title: 'Lỗi!', text: (res && res.message) || 'Không xóa được ngày nghỉ.', confirmButtonColor: '#d33' });
            return;
          }
          ttApDungDsNgayNghi(res.dsNgayNghi);
        })
        .withFailureHandler(function(err) {
          Swal.fire({ icon: 'error', title: 'Lỗi!', text: err && err.message ? err.message : String(err), confirmButtonColor: '#d33' });
        })
        .xoaNgayNghiTrongTrua(ngay, maNamHocHienTai());
    });
  }

  // ==================== THỐNG KÊ: BẢNG CHẤM CÔNG CẢ THÁNG ====================
  var ttTkDuLieu = []; // [{ngay, ngayHienThi, danhSach:[{hoTen, boPhan, lop}]}] của tháng đang xem ở tab Thống kê

  function taiThongKeTT() {
    var thang = document.getElementById('ttTkThang').value;
    var box = document.getElementById('ttTkBang');
    if (!thang) {
      box.innerHTML = '<div class="tt-empty">Vui lòng chọn tháng.</div>';
      document.getElementById('ttTkTomTat').innerHTML = '';
      return;
    }
    box.innerHTML = '<div class="tt-empty">Đang tải dữ liệu...</div>';

    google.script.run
      .withSuccessHandler(function(res) {
        if (document.getElementById('ttTkThang').value !== thang) return; // đã đổi sang tháng khác trong lúc chờ
        ttTkDuLieu = res || [];
        renderThongKeTT();
      })
      .withFailureHandler(function(err) {
        if (document.getElementById('ttTkThang').value !== thang) return;
        ttTkDuLieu = [];
        renderThongKeTT();
      })
      .layTrongTruaTheoThang(thang, maNamHocHienTai());
  }

  function renderThongKeTT() {
    var box = document.getElementById('ttTkBang');
    var tomTat = document.getElementById('ttTkTomTat');
    var thang = document.getElementById('ttTkThang').value;
    if (!box || !thang) return;

    var p = thang.split('-');
    var nam = parseInt(p[0], 10), thangSo = parseInt(p[1], 10);
    var soNgayTrongThang = new Date(nam, thangSo, 0).getDate();
    var tenThu = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];

    // Cột = các ngày Thứ 2 - Thứ 6 của tháng (T7/CN không tổ chức nên không hiển thị)
    var cot = [];
    for (var d = 1; d <= soNgayTrongThang; d++) {
      var ngay = thang + '-' + (d < 10 ? '0' + d : '' + d);
      if (ttLaCuoiTuan(ngay)) continue;
      cot.push({ ngay: ngay, so: d, thu: tenThu[ttParseNgay(ngay).getDay()], nghi: ttLaNgayNghi(ngay) });
    }

    // Gom theo người: key = tên (không phân biệt hoa/thường) -> {hoTen, boPhan, o: {ngay: [lop, ...]}}
    var mapNguoi = {};
    ttTkDuLieu.forEach(function(ngayObj) {
      (ngayObj.danhSach || []).forEach(function(it) {
        var key = (it.hoTen || '').trim().toLowerCase();
        if (!key) return;
        if (!mapNguoi[key]) mapNguoi[key] = { hoTen: it.hoTen, boPhan: it.boPhan || '', o: {} };
        if (!mapNguoi[key].boPhan && it.boPhan) mapNguoi[key].boPhan = it.boPhan;
        if (!mapNguoi[key].o[ngayObj.ngay]) mapNguoi[key].o[ngayObj.ngay] = [];
        mapNguoi[key].o[ngayObj.ngay].push(it.lop || '✔');
      });
    });

    // Thứ tự người: theo danh sách nhân sự (nếu có), còn lại theo tên
    var thuTuGV = {};
    ttDanhSachGV.forEach(function(gv, i) { thuTuGV[(gv.hoTen || '').trim().toLowerCase()] = i; });
    var dsNguoi = Object.keys(mapNguoi).map(function(k) { return mapNguoi[k]; });
    dsNguoi.sort(function(a, b) {
      var ia = thuTuGV[(a.hoTen || '').trim().toLowerCase()];
      var ib = thuTuGV[(b.hoTen || '').trim().toLowerCase()];
      if (ia === undefined) ia = 99999;
      if (ib === undefined) ib = 99999;
      if (ia !== ib) return ia - ib;
      return (a.hoTen || '').localeCompare(b.hoTen || '', 'vi');
    });

    if (dsNguoi.length === 0) {
      tomTat.innerHTML = '';
      box.innerHTML = '<div class="tt-empty">Tháng ' + formatThangHienThiTT(thang) + ' chưa có dữ liệu trông trưa.</div>';
      return;
    }

    // Tổng số buổi mỗi người & số người mỗi ngày
    var demNguoiMoiNgay = {};
    var tongLuot = 0;
    dsNguoi.forEach(function(n) {
      n.soBuoi = 0;
      Object.keys(n.o).forEach(function(ngay) {
        n.soBuoi++;
        tongLuot++;
        demNguoiMoiNgay[ngay] = (demNguoiMoiNgay[ngay] || 0) + 1;
      });
    });
    var soNgayCoNguoi = Object.keys(demNguoiMoiNgay).length;

    tomTat.innerHTML =
      '<span class="tt-tk-chip">👥 ' + dsNguoi.length + ' người</span>' +
      '<span class="tt-tk-chip">📅 ' + soNgayCoNguoi + ' ngày có trông trưa</span>' +
      '<span class="tt-tk-chip">🧮 ' + tongLuot + ' lượt trông</span>';

    // --- Dựng bảng ---
    var html = '<div class="tt-tk-wrap"><table class="tt-tk-table"><thead>';

    // Hàng 1: Thứ
    html += '<tr><th class="tt-tk-c1" rowspan="2">TT</th><th class="tt-tk-c2" rowspan="2">Họ và tên</th><th rowspan="2">Bộ phận</th>';
    cot.forEach(function(c) {
      html += '<th class="' + (c.nghi ? 'tt-tk-nghi' : '') + '"' + (c.nghi ? ' title="' + ttEscHtml(ttNgayNghi[c.ngay] || 'Ngày nghỉ') + '"' : '') + '>' + c.thu + '</th>';
    });
    html += '<th rowspan="2">Số buổi</th></tr>';

    // Hàng 2: Ngày
    html += '<tr class="tt-tk-r2">';
    cot.forEach(function(c) {
      html += '<th class="' + (c.nghi ? 'tt-tk-nghi' : '') + '">' + c.so + '</th>';
    });
    html += '</tr></thead><tbody>';

    dsNguoi.forEach(function(n, i) {
      html += '<tr><td class="tt-tk-c1">' + (i + 1) + '</td>' +
        '<td class="tt-tk-c2">' + ttEscHtml(n.hoTen) + '</td>' +
        '<td class="tt-tk-bp">' + ttEscHtml(n.boPhan) + '</td>';
      cot.forEach(function(c) {
        var lops = n.o[c.ngay];
        if (lops) html += '<td class="tt-tk-co' + (c.nghi ? ' tt-tk-nghi' : '') + '">' + ttEscHtml(lops.join(', ')) + '</td>';
        else html += '<td class="' + (c.nghi ? 'tt-tk-nghi' : '') + '"></td>';
      });
      html += '<td class="tt-tk-tong">' + n.soBuoi + '</td></tr>';
    });

    html += '</tbody><tfoot><tr><td class="tt-tk-c1"></td><td class="tt-tk-c2">Số người / ngày</td><td></td>';
    cot.forEach(function(c) {
      var so = demNguoiMoiNgay[c.ngay] || 0;
      html += '<td class="' + (c.nghi ? 'tt-tk-nghi' : '') + '">' + (so || '') + '</td>';
    });
    html += '<td>' + tongLuot + '</td></tr></tfoot></table></div>';

    // Ghi chú ngày nghỉ của tháng
    var dsNghi = Object.keys(ttNgayNghi).filter(function(n) { return n.substring(0, 7) === thang; }).sort();
    if (dsNghi.length > 0) {
      html += '<div class="tt-tk-note">🏖️ <b>Ngày nghỉ:</b> ' + dsNghi.map(function(n) {
        var pp = n.split('-');
        var lyDo = ttNgayNghi[n];
        return parseInt(pp[2], 10) + '/' + parseInt(pp[1], 10) + (lyDo ? ' (' + ttEscHtml(lyDo) + ')' : '');
      }).join(', ') + '</div>';
    }

    box.innerHTML = html;
  }

  // Khởi động module khi trang được nhúng vào DOM
  taiDanhSachGVTrongTrua();
</script>
