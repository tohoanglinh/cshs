<script>
  let globalDSGV = [];
  let originalData = [];

  function khoiTaoLichTruc() {
    const today = new Date();
    const dayOfWeek = today.getDay();
    
    const distanceToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    const monday = new Date(today);
    monday.setDate(today.getDate() + distanceToMonday);

    const year = monday.getFullYear();
    const month = String(monday.getMonth() + 1).padStart(2, '0');
    const day = String(monday.getDate()).padStart(2, '0');
    
    document.getElementById('tcTuNgay').value = `${year}-${month}-${day}`;
    taiDuLieuTuSheet();
  }

  function taiDuLieuTuSheet() {
    const tuNgayVal = document.getElementById('tcTuNgay').value;
    const loading = document.getElementById('tcLoading');
    if (loading) loading.style.display = 'flex';

    var selectNamHocEl = document.getElementById('globalSelectNamHoc');
    var tenSheet = selectNamHocEl ? selectNamHocEl.value : "2627";

    google.script.run
      .withSuccessHandler(function(res) {
        globalDSGV = res.dsgv;
        originalData = JSON.parse(JSON.stringify(res.lichTruc || []));
        capNhatNgayTrongTuan(res.lichTruc);
        khoaLichTruc();
        if (loading) loading.style.display = 'none';
      })
      .withFailureHandler(function(err) {
        if (loading) loading.style.display = 'none';
        Swal.fire({ icon: 'error', title: 'Lỗi tải dữ liệu!', text: err });
      })
      .layDuLieuTrucCong(tuNgayVal, tenSheet);
  }

  function capNhatNgayTrongTuan(lichDaLuu) {
    const tuNgayVal = document.getElementById('tcTuNgay').value;
    if (!tuNgayVal) return;

    const monday = new Date(tuNgayVal);
    const tbody = document.getElementById('tcTableBody');
    tbody.innerHTML = '';

    let datalistHTML = `<datalist id="dsGiaoVien">` 
      + globalDSGV.map(name => `<option value="${name}">`).join('') 
      + `</datalist>`;

    const tenThu = ['Chủ Nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];

    for (let i = 0; i < 5; i++) {
      const currentDate = new Date(monday);
      currentDate.setDate(monday.getDate() + i);

      const ngayStr = currentDate.getDate() + '/' + (currentDate.getMonth() + 1);
      const ngayFullStr = currentDate.getFullYear() + '-' + String(currentDate.getMonth() + 1).padStart(2, '0') + '-' + String(currentDate.getDate()).padStart(2, '0');
      const thuStr = tenThu[currentDate.getDay()];

      if (i === 4) {
        document.getElementById('tcDenNgayText').innerText = ngayStr + '/' + currentDate.getFullYear();
      }

      let dataNgay = (lichDaLuu || []).find(item => item.ngay === ngayFullStr) || {};

      const nameField = (cls) => `
        <div class="tc-name-box">
          <div class="tc-name-text"></div>
          <input type="text" class="tc-select ${cls}" list="dsGiaoVien" disabled>
        </div>`;

      let tr = document.createElement('tr');
      tr.setAttribute('data-ngay', ngayFullStr);
      tr.setAttribute('data-thu', thuStr);
      tr.innerHTML = `
        <td><b>${thuStr}</b></td>
        <td>${ngayStr}</td>
        <td>
          ${nameField('cong1_p1')}
          ${nameField('cong1_p2')}
        </td>
        <td>
          ${nameField('cong2_p1')}
          ${nameField('cong2_p2')}
        </td>
        ${i === 0 ? datalistHTML : ''}
      `;
      tbody.appendChild(tr);

      const setInitVal = (selector, val) => {
        const input = tr.querySelector(selector);
        const text = val || "";
        input.value = text;
        input.setAttribute('data-init', text);
        const label = input.closest('.tc-name-box').querySelector('.tc-name-text');
        if (label) label.textContent = text;
      };

      setInitVal('.cong1_p1', dataNgay.c1_p1);
      setInitVal('.cong1_p2', dataNgay.c1_p2);
      setInitVal('.cong2_p1', dataNgay.c2_p1);
      setInitVal('.cong2_p2', dataNgay.c2_p2);
    }

    ganSuKienKiemTra();
  }

  function ganSuKienKiemTra() {
    document.querySelectorAll('.tc-select').forEach(input => {
      const checkFn = function() {
        const initVal = input.getAttribute('data-init') || "";
        if (input.value.trim() !== initVal.trim()) {
          input.classList.add('is-changed');
        } else {
          input.classList.remove('is-changed');
        }
      };

      input.addEventListener('input', checkFn);
      input.addEventListener('change', checkFn);
      input.addEventListener('keyup', checkFn);
      input.addEventListener('blur', checkFn);
    });
  }

  // Hàm kiểm tra chính xác xem có ô nào bị đổi giá trị so với ban đầu hay không
  function coThayDoiChuaLuu() {
    let hasChange = false;
    document.querySelectorAll('.tc-select').forEach(input => {
      const initVal = input.getAttribute('data-init') || "";
      if (input.value.trim() !== initVal.trim()) {
        input.classList.add('is-changed');
        hasChange = true;
      } else {
        input.classList.remove('is-changed');
      }
    });
    return hasChange;
  }

  function suaPhanCong() {
    document.querySelectorAll('.tc-select').forEach(select => {
      select.disabled = false;
      select.style.display = '';
      const box = select.closest('.tc-name-box');
      if (box) {
        box.style.display = '';
        box.classList.remove('is-view');
      }
    });

    var btnGroup = document.querySelector('.tc-btn-group');
    if (btnGroup) btnGroup.classList.remove('photo-mode');

    document.getElementById('btnSua').disabled = true;
    document.getElementById('btnLuu').disabled = false;
  }

  function huySuaPhanCong() {
    if (coThayDoiChuaLuu()) {
      Swal.fire({
        title: 'Hủy thay đổi?',
        text: "Các thông tin bạn vừa nhập sẽ không được lưu!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Đồng ý Hủy',
        cancelButtonText: 'Quay lại'
      }).then((result) => {
        if (result.isConfirmed) {
          capNhatNgayTrongTuan(originalData);
          khoaLichTruc();
        }
      });
    } else {
      khoaLichTruc();
    }
  }

  function khoaLichTruc() {
    document.querySelectorAll('.tc-select').forEach(select => {
      select.disabled = true;
      select.classList.remove('is-changed');
      const box = select.closest('.tc-name-box');
      const label = box ? box.querySelector('.tc-name-text') : null;
      const text = (select.value || "").trim();
      if (label) label.textContent = text;

      if (!text) {
        if (box) box.style.display = 'none';
        select.style.display = 'none';
      } else {
        if (box) {
          box.style.display = '';
          box.classList.add('is-view');
        }
        select.style.display = '';
      }
    });

    var btnGroup = document.querySelector('.tc-btn-group');
    if (btnGroup) btnGroup.classList.add('photo-mode');

    document.getElementById('btnSua').disabled = false;
    document.getElementById('btnLuu').disabled = true;
  }

  function kiemTraDoiTuan() {
    if (coThayDoiChuaLuu()) {
      Swal.fire({
        title: 'Bạn chưa lưu dữ liệu!',
        text: "Nếu chuyển tuần khác, các dữ liệu vừa nhập sẽ bị mất!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Bỏ lưu & Chuyển tuần',
        cancelButtonText: 'Ở lại Lưu'
      }).then((result) => {
        if (result.isConfirmed) {
          taiDuLieuTuSheet();
        }
      });
    } else {
      taiDuLieuTuSheet();
    }
  }

  // Xử lý nút Trang chủ (đặt tên riêng để không bị hàm veTrangChu() toàn cục ghi đè)
  function veTrangChuTrucCong(e) {
    if(e) e.preventDefault(); // Chặn hành vi mặc định nếu có

    if (coThayDoiChuaLuu()) {
      Swal.fire({
        title: 'Bạn chưa lưu dữ liệu!',
        text: "Các thay đổi của bạn chưa được lưu. Bạn có chắc muốn về Trang chủ không?",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Thoát không lưu',
        cancelButtonText: 'Ở lại Lưu'
      }).then((result) => {
        if (result.isConfirmed) {
          thucHienChuyenTrang();
        }
      });
    } else {
      thucHienChuyenTrang();
    }
  }

  function thucHienChuyenTrang() {
    // Gọi hàm veTrangChu() toàn cục (định nghĩa ở Index_JS.html) để ẩn trucCongPage và hiện lại mainPage
    if (typeof veTrangChu === 'function') {
      veTrangChu();
    }
  }

  // Kiểm tra xem trong CÙNG 1 NGÀY có ai bị xếp trực từ 2 lần trở lên không
  // (gộp cả 4 vị trí: cổng 1 người 1/2, cổng 2 người 1/2 - vì 1 người không nên trực 2 lần/ngày dù khác cổng)
  function kiemTraTrungTen(dataLuu) {
    var loiTrung = [];
    dataLuu.forEach(function(row) {
      var danhSachTen = [
        { ten: (row.c1_p1 || '').trim(), viTri: 'Cổng 1' },
        { ten: (row.c1_p2 || '').trim(), viTri: 'Cổng 1' },
        { ten: (row.c2_p1 || '').trim(), viTri: 'Cổng 2' },
        { ten: (row.c2_p2 || '').trim(), viTri: 'Cổng 2' }
      ].filter(function(item) { return item.ten !== ''; });

      var demTen = {};
      danhSachTen.forEach(function(item) {
        var key = item.ten.toLowerCase();
        if (!demTen[key]) demTen[key] = { ten: item.ten, viTriList: [] };
        demTen[key].viTriList.push(item.viTri);
      });

      Object.keys(demTen).forEach(function(key) {
        if (demTen[key].viTriList.length > 1) {
          loiTrung.push(row.thu + ' (' + row.ngay + ') - trùng tên "' + demTen[key].ten + '" (' + demTen[key].viTriList.join(' + ') + ')');
        }
      });
    });
    return loiTrung;
  }

  function luuPhanCong() {
    const rows = document.querySelectorAll('#tcTableBody tr');
    let dataLuu = [];

    rows.forEach(tr => {
      dataLuu.push({
        thu: tr.getAttribute('data-thu'),
        ngay: tr.getAttribute('data-ngay'),
        c1_p1: tr.querySelector('.cong1_p1').value,
        c1_p2: tr.querySelector('.cong1_p2').value,
        c2_p1: tr.querySelector('.cong2_p1').value,
        c2_p2: tr.querySelector('.cong2_p2').value
      });
    });

    var loiTrung = kiemTraTrungTen(dataLuu);
    if (loiTrung.length > 0) {
      Swal.fire({
        title: 'Phát hiện trùng tên!',
        html: 'Cùng một ngày đang có người được xếp trực từ 2 lần trở lên:<br><br>' + loiTrung.join('<br>') + '<br><br>Bạn vẫn muốn lưu?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Vẫn lưu',
        cancelButtonText: 'Kiểm tra lại'
      }).then((result) => {
        if (result.isConfirmed) {
          thucHienLuuPhanCong(dataLuu);
        }
      });
    } else {
      thucHienLuuPhanCong(dataLuu);
    }
  }

  function thucHienLuuPhanCong(dataLuu) {
    var selectNamHocEl = document.getElementById('globalSelectNamHoc');
    var tenSheet = selectNamHocEl ? selectNamHocEl.value : "2627";

    google.script.run
    .withSuccessHandler(function(msg) {
      Swal.fire({
        icon: 'success',
        title: 'Thành công!',
        text: msg || 'Đã lưu lịch phân công trực cổng thành công!',
        confirmButtonColor: '#2e7d32',
        confirmButtonText: 'Đồng ý'
      });
      
      originalData = JSON.parse(JSON.stringify(dataLuu));
      
      document.querySelectorAll('.tc-select').forEach(input => {
        input.setAttribute('data-init', input.value);
        input.classList.remove('is-changed');
      });

      khoaLichTruc();
    })
    .withFailureHandler(function(err) {
      Swal.fire({ icon: 'error', title: 'Lỗi khi lưu!', text: err });
    })
    .luuLichTrucCong(dataLuu, tenSheet);
  }

  document.addEventListener("DOMContentLoaded", khoiTaoLichTruc);
</script>
