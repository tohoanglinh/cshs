<style>

    max-width: 640px;

    background: #fff;

    padding-bottom: 90px;
    box-sizing: border-box;

  .tt-tab-content { display: none; }

  .tt-form-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .tt-form-group { flex: 1; min-width: 130px; margin-bottom: 0; }

    border-radius: 10px;
    padding: 14px;
